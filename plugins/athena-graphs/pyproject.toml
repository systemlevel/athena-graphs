[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-graphs"
version = "0.1.0"
description = "Backend-agnostic, inspectable graph orchestration for AI agents."
readme = { text = "Athena Graphs runtime bundled with the Athena Graphs agent plugin.", content-type = "text/plain" }
requires-python = ">=3.10"
dependencies = []
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
grok = ["openai>=1.66"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
agentgraph = "agentgraph.cli:main"
agentgraph-mcp = "agentgraph.mcp_server:main"

[tool.setuptools]
packages = ["agentgraph", "agentgraph.adapters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests"]
